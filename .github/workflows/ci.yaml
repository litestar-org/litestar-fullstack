name: Tests and Linting

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  UV_LOCKED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"

      - name: Install Python dependencies
        run: uv sync --all-groups --frozen --no-build

      - name: Install frontend dependencies
        run: cd src/js/web && bun install --frozen-lockfile --ignore-scripts

      - name: Python lint and format check
        run: |
          uv run --no-sync --no-build ruff check src/py/app src/py/tests tools
          uv run --no-sync --no-build ruff format --check src/py/app src/py/tests tools
          uv run --no-sync --no-build mypy src/py/app src/py/tests tools
          uv run --no-sync --no-build pyright
          uv run --no-sync --no-build slotscheck -m app
          uv run --no-sync --no-build codespell

      - name: Audit workflows
        run: uv run --no-sync --no-build zizmor .github/workflows

      - name: Verify security routes and MCP tool schema
        run: |
          uv run --no-sync --no-build app security routes
          uv run --no-sync --no-build app mcp export-tool-spec --strict-bounds

      - name: Verify OpenAPI and AsyncAPI TypeGen pipeline
        run: make types

  frontend-and-wheel:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"

      - name: Install dependencies
        run: |
          uv sync --all-groups --frozen --no-build
          (cd src/js/web && bun install --frozen-lockfile --ignore-scripts)
          (cd src/js/templates && bun install --frozen-lockfile --ignore-scripts)

      - name: Generate TypeScript SDK and channels
        run: make types

      - name: Frontend lint, Vitest, and SPA build
        run: cd src/js/web && bun run lint:check && bun run test && bun run build

      - name: Build wheel and verify bundled static assets
        run: |
          make build-wheel
          unzip -l dist/*.whl
          unzip -l dist/*.whl | grep -E "app/server/static/web/index\.html"
          unzip -l dist/*.whl | grep -E "app/server/static/web/assets/.*\.js"
          unzip -l dist/*.whl | grep -E "app/server/static/web/assets/.*\.css"
          unzip -l dist/*.whl | grep -E "app/server/static/email/.*\.html"

  test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"

      - name: Install dependencies
        run: uv sync --all-groups --frozen --no-build

      - name: Build email templates
        run: make build-emails

      - name: Test with Coverage (PostgreSQL via pytest-databases)
        run: uv run --no-sync --no-build pytest src/py/tests -m '' --cov=src/py/app --cov-report=xml

      - if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-xml
          path: coverage.xml

  build-docs:
    needs:
      - validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen --no-build

      - name: Build docs
        run: make docs

      - name: Save PR number
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo $PR_NUMBER > .pr_number

      - name: Upload artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-preview
          path: |
            docs/_build/html
            .pr_number

  codeql:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Initialize CodeQL
        uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          languages: python

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --frozen --no-build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
