services:
  db:
    image: postgres:17
    ports:
      - "15432:5432"
    hostname: db
    environment:
      POSTGRES_PASSWORD: "app"
      POSTGRES_USER: "app"
      POSTGRES_DB: "app"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - app
      interval: 2s
      timeout: 3s
      retries: 40
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "18025:8025"  # Web UI
      - "11025:1025"  # SMTP server
    hostname: mailpit
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "wget --no-verbose --tries=1 --spider http://localhost:8025/livez || exit 1"
      interval: 10s
      timeout: 5s
      retries: 3
  app:
    build:
      context: ../../..
      dockerfile: tools/deploy/docker/Dockerfile.distroless
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      VITE_DEV_MODE: "false"
    env_file:
      - .env.docker
  worker:
    build:
      context: ../../..
      dockerfile: tools/deploy/docker/Dockerfile.worker
    command: ["app", "queues", "run"]
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
  migrator:
    build:
      context: ../../..
      dockerfile: tools/deploy/docker/Dockerfile.distroless
    restart: "no"
    command: ["app", "database", "upgrade", "--no-prompt"]
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
volumes:
  db-data: {}
